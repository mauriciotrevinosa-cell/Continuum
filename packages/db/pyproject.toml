[project]
name = "continuum-db"
version = "0.0.0"
description = "SQLAlchemy models, session, Alembic migrations."
requires-python = ">=3.12,<3.13"
dependencies = ["continuum-core", "continuum-config", "sqlalchemy>=2.0", "alembic>=1.14", "psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
continuum-config = { workspace = true }
continuum-core = { workspace = true }
