[project]
name = "continuum-jobs"
version = "0.0.0"
description = "Durable job state machine, queue, leases, checkpoints."
requires-python = ">=3.12,<3.13"
dependencies = ["continuum-core", "continuum-config", "continuum-db", "continuum-observability"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
continuum-config = { workspace = true }
continuum-core = { workspace = true }
continuum-db = { workspace = true }
continuum-observability = { workspace = true }
