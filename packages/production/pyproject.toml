[project]
name = "continuum-production"
version = "0.0.0"
description = "Phase 1 rough manga production: recipes, reference bundles, append-only attempts, review."
requires-python = ">=3.12,<3.13"
dependencies = ["continuum-core", "continuum-config", "continuum-db", "continuum-storage", "continuum-imaging", "continuum-jobs", "continuum-library", "continuum-observability", "continuum-providers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
continuum-config = { workspace = true }
continuum-core = { workspace = true }
continuum-db = { workspace = true }
continuum-imaging = { workspace = true }
continuum-jobs = { workspace = true }
continuum-library = { workspace = true }
continuum-observability = { workspace = true }
continuum-providers = { workspace = true }
continuum-storage = { workspace = true }
