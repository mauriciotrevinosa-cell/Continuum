[project]
name = "continuum-worker"
version = "0.0.0"
description = "Standalone durable worker process and synthetic handlers."
requires-python = ">=3.12,<3.13"
dependencies = ["continuum-core", "continuum-config", "continuum-db", "continuum-jobs", "continuum-storage", "continuum-providers", "continuum-observability"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
continuum-config = { workspace = true }
continuum-core = { workspace = true }
continuum-db = { workspace = true }
continuum-jobs = { workspace = true }
continuum-observability = { workspace = true }
continuum-providers = { workspace = true }
continuum-storage = { workspace = true }
